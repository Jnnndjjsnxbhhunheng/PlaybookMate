<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praxis — Review Queue</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/app.js" defer></script>
</head>
<body class="h-full bg-zinc-50 text-zinc-900 font-sans">

<header class="bg-white border-b border-zinc-200 sticky top-0 z-40">
  <div class="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="/" class="text-zinc-400 hover:text-zinc-700 text-sm">← Dashboard</a>
      <span class="text-zinc-300">/</span>
      <span class="font-semibold">Review Queue</span>
    </div>
    <div class="flex items-center gap-4">
      <div id="role-switcher"></div>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-6 py-8">

  <!-- PM view: simplified read-only -->
  <div data-role="pm">
    <div class="mb-6">
      <h1 class="text-2xl font-bold mb-1">上线审核队列</h1>
      <p class="text-sm text-zinc-500">以下 HS 已通过回归测试，等待算法工程师审核后上线</p>
    </div>
    <div id="pm-review-list" class="space-y-4"></div>
    <div id="pm-empty" class="hidden text-center py-20 text-zinc-400">
      <div class="text-4xl mb-3">✓</div>
      <p>当前没有待审核项目</p>
    </div>
  </div>

  <!-- ALGO view: full review controls -->
  <div data-role="algo">
    <div class="mb-6 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold mb-1">Review Queue</h1>
        <p class="text-sm text-zinc-500">只有通过所有回归用例的 HS 才会出现在这里</p>
      </div>
      <button onclick="refreshKnowledge()"
        class="text-sm border border-zinc-300 px-4 py-2 rounded-lg hover:bg-zinc-100 transition-colors">
        🔄 刷新知识层
      </button>
    </div>
    <div id="algo-review-list" class="space-y-6"></div>
    <div id="algo-empty" class="hidden text-center py-20 text-zinc-400">
      <div class="text-4xl mb-3">✓</div>
      <p>没有待审核的 HS</p>
      <p class="text-xs mt-1">所有 HS 都处于探索或简化阶段</p>
    </div>
  </div>

</main>

<!-- Review Modal (algo) -->
<div id="modal-review" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4">
    <div class="px-6 py-5 border-b border-zinc-100 flex items-center justify-between">
      <h2 class="text-lg font-semibold">提交审核意见</h2>
      <button onclick="closeReviewModal()" class="text-zinc-400 hover:text-zinc-700 text-xl">×</button>
    </div>
    <form id="form-review" onsubmit="submitReview(event)" class="px-6 py-5 space-y-4">
      <input type="hidden" name="hs_id" />
      <div class="flex gap-3">
        <button type="button" id="btn-approve"
          onclick="selectDecision('approve')"
          class="flex-1 py-3 rounded-xl border-2 border-zinc-200 text-sm font-medium hover:border-emerald-400 hover:bg-emerald-50 hover:text-emerald-700 transition-all">
          ✓ 批准上线
        </button>
        <button type="button" id="btn-reject"
          onclick="selectDecision('reject')"
          class="flex-1 py-3 rounded-xl border-2 border-zinc-200 text-sm font-medium hover:border-red-400 hover:bg-red-50 hover:text-red-700 transition-all">
          ✕ 拒绝
        </button>
      </div>
      <input type="hidden" name="decision" />
      <div>
        <label class="block text-sm font-medium mb-1">备注</label>
        <textarea name="comment" rows="3" placeholder="说明批准理由或需要修改的具体问题…"
          class="w-full border border-zinc-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-400 resize-none"></textarea>
      </div>
      <div class="flex justify-end gap-3">
        <button type="button" onclick="closeReviewModal()" class="px-4 py-2 text-sm text-zinc-600">取消</button>
        <button type="submit" id="btn-submit-review" disabled
          class="px-5 py-2 bg-zinc-900 text-white text-sm rounded-lg hover:bg-zinc-700 transition-colors disabled:opacity-40">
          提交
        </button>
      </div>
    </form>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Load review queue
// ---------------------------------------------------------------------------
async function loadReviews() {
  const list = await apiFetch("/api/review").catch(() => []);
  renderPMView(list);
  renderAlgoView(list);
}

function renderPMView(list) {
  const container = document.getElementById("pm-review-list");
  const empty = document.getElementById("pm-empty");
  if (list.length === 0) { empty.classList.remove("hidden"); return; }
  container.innerHTML = list.map(h => `
    <div class="bg-white rounded-xl border border-zinc-200 px-6 py-5">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-3">
          <a href="/hs/${h.hs_id}" class="font-semibold text-zinc-900 hover:underline">${h.hs_id}</a>
          ${phaseBadge(h.phase)}
        </div>
        <span class="text-sm text-zinc-400">${h.domain}</span>
      </div>
      <p class="text-sm text-zinc-500">${h.description || ""}</p>
      <div class="mt-3 text-xs text-zinc-400 flex gap-4">
        <span>最优分数: ${h.best_score != null ? h.best_score.toFixed(4) : "—"}</span>
        <span>总 Trials: ${h.total_trials}</span>
      </div>
      ${h.promotion_blockers?.length ? `
        <div class="mt-3 text-xs text-red-500">
          ⚠ 阻断项: ${h.promotion_blockers.join(" · ")}
        </div>` : ""}
    </div>
  `).join("");
}

function renderAlgoView(list) {
  const container = document.getElementById("algo-review-list");
  const empty = document.getElementById("algo-empty");
  if (list.length === 0) { empty.classList.remove("hidden"); return; }

  container.innerHTML = list.map(h => {
    const last = h.last_trial;
    const canApprove = !h.promotion_blockers?.length;
    return `
    <div class="bg-white rounded-2xl border border-zinc-200 overflow-hidden">
      <!-- header -->
      <div class="px-6 py-4 border-b border-zinc-100 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="/hs/${h.hs_id}" class="font-bold text-lg hover:underline">${h.hs_id}</a>
          ${phaseBadge(h.phase)}
        </div>
        <div class="flex items-center gap-2">
          ${canApprove
            ? `<button onclick="openReviewModal('${h.hs_id}')"
                class="px-4 py-2 bg-zinc-900 text-white text-sm rounded-lg hover:bg-zinc-700 transition-colors">
                审核
               </button>`
            : `<span class="text-xs text-red-500 border border-red-200 px-3 py-1.5 rounded-lg">有阻断项</span>`
          }
        </div>
      </div>
      <!-- body -->
      <div class="px-6 py-5 grid grid-cols-3 gap-6">
        <!-- metrics -->
        <div class="col-span-1 space-y-4">
          <div>
            <div class="text-xs text-zinc-400 mb-0.5">领域</div>
            <div class="text-sm font-medium">${h.domain}</div>
          </div>
          <div>
            <div class="text-xs text-zinc-400 mb-0.5">最优分数</div>
            <div class="text-sm font-medium">${h.best_score != null ? h.best_score.toFixed(4) : "—"}</div>
          </div>
          <div>
            <div class="text-xs text-zinc-400 mb-0.5">总 Trials</div>
            <div class="text-sm">${h.total_trials}</div>
          </div>
          <div>
            <div class="text-xs text-zinc-400 mb-0.5">累计 Tokens</div>
            <div class="text-sm">${h.cumulative_tokens ? (h.cumulative_tokens/1000).toFixed(1)+"k" : "0"}</div>
          </div>
        </div>

        <!-- last trial -->
        <div class="col-span-2">
          <div class="text-xs text-zinc-400 mb-2">最后一次 Trial</div>
          ${last ? `
            <div class="bg-zinc-50 rounded-xl p-4 text-sm">
              <div class="flex items-center gap-3 mb-2">
                <span class="font-mono text-xs text-zinc-400">#${last.trial_idx}</span>
                ${outcomeBadge(last.outcome)}
                <span class="font-medium">${last.score.primary.toFixed(4)}</span>
                ${last.score_delta != null
                  ? `<span class="${last.score_delta >= 0 ? "text-emerald-600" : "text-red-500"}">${last.score_delta >= 0 ? "+" : ""}${last.score_delta.toFixed(4)}</span>`
                  : ""}
              </div>
              ${last.policy_diff?.description
                ? `<p class="text-zinc-600">${escHtml(last.policy_diff.description)}</p>` : ""}
              <div class="flex gap-4 mt-2 text-xs text-zinc-400">
                <span>回归通过 ${last.regression_pass_count}/${last.regression_total}</span>
                ${last.regression_fail_count ? `<span class="text-red-500">失败 ${last.regression_fail_count}</span>` : ""}
              </div>
            </div>
          ` : `<p class="text-sm text-zinc-400">暂无</p>`}

          ${h.promotion_blockers?.length ? `
            <div class="mt-3 bg-red-50 border border-red-200 rounded-xl p-3">
              <div class="text-xs font-semibold text-red-600 mb-1">上线阻断项</div>
              <ul class="list-disc list-inside text-xs text-red-700 space-y-0.5">
                ${h.promotion_blockers.map(b => `<li>${escHtml(b)}</li>`).join("")}
              </ul>
            </div>` : ""}
        </div>
      </div>
    </div>`;
  }).join("");
}

// ---------------------------------------------------------------------------
// Review modal
// ---------------------------------------------------------------------------
let _selectedDecision = null;

function openReviewModal(hsId) {
  _selectedDecision = null;
  const form = document.getElementById("form-review");
  form.reset();
  form.hs_id.value = hsId;
  document.getElementById("btn-submit-review").disabled = true;
  document.getElementById("modal-review").classList.remove("hidden");
  // reset button styles
  document.getElementById("btn-approve").className = "flex-1 py-3 rounded-xl border-2 border-zinc-200 text-sm font-medium hover:border-emerald-400 hover:bg-emerald-50 hover:text-emerald-700 transition-all";
  document.getElementById("btn-reject").className = "flex-1 py-3 rounded-xl border-2 border-zinc-200 text-sm font-medium hover:border-red-400 hover:bg-red-50 hover:text-red-700 transition-all";
}

function closeReviewModal() {
  document.getElementById("modal-review").classList.add("hidden");
}

function selectDecision(decision) {
  _selectedDecision = decision;
  document.getElementById("form-review").decision.value = decision;
  document.getElementById("btn-submit-review").disabled = false;
  if (decision === "approve") {
    document.getElementById("btn-approve").className = "flex-1 py-3 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-700 text-sm font-semibold transition-all";
    document.getElementById("btn-reject").className = "flex-1 py-3 rounded-xl border-2 border-zinc-200 text-sm font-medium hover:border-red-400 hover:bg-red-50 hover:text-red-700 transition-all";
  } else {
    document.getElementById("btn-reject").className = "flex-1 py-3 rounded-xl border-2 border-red-500 bg-red-50 text-red-700 text-sm font-semibold transition-all";
    document.getElementById("btn-approve").className = "flex-1 py-3 rounded-xl border-2 border-zinc-200 text-sm font-medium hover:border-emerald-400 hover:bg-emerald-50 hover:text-emerald-700 transition-all";
  }
}

async function submitReview(e) {
  e.preventDefault();
  const form = e.target;
  const hsId = form.hs_id.value;
  const decision = form.decision.value;
  if (!decision) { toast("请先选择批准或拒绝", "error"); return; }
  try {
    await apiFetch(`/api/hs/${hsId}/review`, {
      method: "POST",
      body: { decision, comment: form.comment.value },
    });
    toast(decision === "approve" ? "已批准上线 ✓" : "已拒绝", decision === "approve" ? "success" : "info");
    closeReviewModal();
    loadReviews();
  } catch (err) {
    toast(err.message, "error");
  }
}

// ---------------------------------------------------------------------------
// Knowledge layer refresh
// ---------------------------------------------------------------------------
async function refreshKnowledge() {
  try {
    await apiFetch("/api/knowledge/refresh", { method: "POST" });
    toast("知识层已刷新", "success");
  } catch (err) {
    toast(err.message, "error");
  }
}

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

document.getElementById("modal-review").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeReviewModal();
});

loadReviews();
</script>
</body>
</html>
