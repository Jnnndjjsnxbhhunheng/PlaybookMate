[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxis"
version = "0.1.0"
description = "Heuristic System OS — maintain business strategy like code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "mcp>=1.0",          # MCP Python SDK for building tool servers
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "croniter>=2.0",
    "networkx>=3.3",     # ontology graph in knowledge layer
]

[project.scripts]
praxis = "praxis.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
